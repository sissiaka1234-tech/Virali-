<html lang="fr">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VIRALI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concept : application mobile vert forêt, accent safran, navigation basse à 5 onglets, une colonne de 560px */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#E2E9E4; --fg:#0F1C16; --muted:#566359; --line:#CAD5CD;
  --accent:#F2B632; --on-accent:#1A1300; --accent-ink:#8A5A00; --good:#1C8A52; --bad:#C4372A; --info:#2F6F9F;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif; --font-b:'DM Sans',system-ui,sans-serif; --font-m:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B130F; --surface:#141F19; --surface2:#1D2B23; --fg:#EAF1EC; --muted:#93A59A; --line:#263629;
    --accent:#F2B632; --on-accent:#1A1300; --accent-ink:#F2B632; --good:#3DBE7B; --bad:#F06A55; --info:#6CB1E3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B130F; --surface:#141F19; --surface2:#1D2B23; --fg:#EAF1EC; --muted:#93A59A; --line:#263629;
  --accent:#F2B632; --on-accent:#1A1300; --accent-ink:#F2B632; --good:#3DBE7B; --bad:#F06A55; --info:#6CB1E3; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px;max-width:560px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:22px;letter-spacing:.06em}
.brand svg{width:28px;height:28px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
main{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.h-page{font-size:26px;font-weight:800}
.sub{color:var(--muted);font-size:14px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row.wrap-r{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spread{justify-content:space-between}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px 16px;min-height:44px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.full{width:100%}
.btn:active{transform:translateY(1px)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
.kpi{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.kpi b{font-family:var(--font-d);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.soon{color:var(--muted)}
.edslot{position:relative;background:#000;border-radius:12px;overflow:hidden;margin:8px 0}
.edslot video{display:block;width:100%;max-height:55vh;background:#000}
.edcap{position:absolute;left:6%;right:6%;bottom:14%;text-align:center;color:#fff;font-weight:800;font-size:clamp(14px,4.4vw,24px);line-height:1.25;text-shadow:0 0 4px #000,0 0 4px #000,0 0 2px #000;pointer-events:none}
.pill.warn{color:var(--accent-ink);border-color:var(--accent-ink)}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabs .in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,1fr);padding-inline:8px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700;min-height:48px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent-ink)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent-ink)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.sec:first-child{border-top:0;padding-top:0}
.sec .time{font-family:var(--font-m);font-size:12px;color:var(--accent-ink)}
.sec .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tagbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-width:0}
.item .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button.d{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:500;padding:0}
.cal button.d.out{visibility:hidden}
.cal button.d.today{border-color:var(--accent-ink);border-width:2px}
.cal button.d.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal .dots i.done{background:var(--good)}
.reco{display:flex;gap:10px;align-items:flex-start}
.reco::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--info)}
.reco.good::before{background:var(--good)}
.reco.warn::before{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
svg.chart text{fill:var(--muted);font-family:var(--font-m);font-size:9px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .b{fill:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.note{font-size:13px;color:var(--muted)}
.banner{border:1px solid var(--accent-ink);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='virali.v1';
var DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
var DAYS_FULL=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var PLAT={tiktok:'TikTok',youtube:'YouTube',instagram:'Instagram'};

/* ---------- utilitaires ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return Math.random().toString(36).slice(2,9);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);}
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function nf(n){return Math.round(n).toLocaleString('fr-FR');}
function pct(n){return (Math.round(n*10)/10).toLocaleString('fr-FR')+' %';}
function dowIdx(d){return (d.getDay()+6)%7;}
function shortDate(s){var d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function longDate(s){var d=parse(s);return DAYS_FULL[dowIdx(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()];}
function mmss(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+pad(sec%60);}
function srtTime(t){var ms=Math.round(t*1000);var h=Math.floor(ms/3600000);ms-=h*3600000;var m=Math.floor(ms/60000);ms-=m*60000;var s=Math.floor(ms/1000);ms-=s*1000;return pad(h)+':'+pad(m)+':'+pad(s)+','+('00'+ms).slice(-3);}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ');}

/* ---------- données ---------- */
function defaults(){return {v:1,form:{},posts:[],stats:[],library:[],coach:null,theme:'auto',trialStart:'',profile:null};}
function seed(){
  var s=defaults(), t=new Date();
  function p(off,plat,title,time,st,note){s.posts.push({id:uid(),date:iso(addDays(t,off)),plat:plat,title:title,time:time,status:st,note:note||'',demo:true});}
  p(0,'tiktok','3 erreurs qui bloquent ta croissance','18:00','planned','Hook : Arrête de faire cette erreur');
  p(1,'instagram','Ma routine de création en 20 minutes','12:30','planned','');
  p(3,'youtube','Débuter sur les réseaux : guide complet','17:00','planned','Chapitres à préparer');
  p(-1,'tiktok','Le format qui double tes vues','18:00','done','');
  p(-2,'instagram','Pourquoi tes Reels stagnent','19:00','done','');
  var rows=[[-9,'tiktok',1200,96,14,8,12,28],[-8,'instagram',640,58,6,5,7,22],[-7,'tiktok',2300,170,31,22,35,35],[-6,'youtube',410,32,9,3,4,240],[-5,'tiktok',980,64,8,5,6,45],[-4,'instagram',1350,121,17,14,18,30],[-3,'tiktok',4100,310,52,60,88,32],[-2,'instagram',900,81,9,7,9,25],[-1,'tiktok',5200,402,66,71,104,29]];
  rows.forEach(function(r){s.stats.push({id:uid(),date:iso(addDays(t,r[0])),plat:r[1],views:r[2],likes:r[3],comments:r[4],shares:r[5],follow:r[6],dur:r[7],title:'',demo:true});});
  return s;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==='object'){return Object.assign(defaults(),o);}}}catch(e){}
  return seed();
}
var S=load();
var TRIAL=7;
var AIKEY='virali.key', AIMODEL='virali.model', AIPROXY='virali.proxy';
if(!S.trialStart){S.trialStart=iso(new Date());}
function trialLeft(){var d=Math.floor((parse(iso(new Date()))-parse(S.trialStart))/86400000);return Math.max(0,TRIAL-d);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
save();
var UI={tab:'home',sub:'script',script:null,pack:null,subs:null,hookRes:null,adapt:null,ideas:null,asub:'assist',ai:{busy:false,out:'',err:'',where:''},cal:{y:new Date().getFullYear(),m:new Date().getMonth()},sel:iso(new Date()),planFor:null,wipe:false};
function F(id,def){var v=S.form[id];return (v===undefined||v===null||v==='')?(def===undefined?'':def):v;}
function hasDemo(){return S.posts.some(function(x){return x.demo;})||S.stats.some(function(x){return x.demo;})||S.library.some(function(x){return x.demo;});}

/* ---------- retours ---------- */
var tt;
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on');},2200);}
function copy(t){
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'Copié':'Copie impossible, sélectionne le texte');}
  try{navigator.clipboard.writeText(t).then(function(){toast('Copié');},fb);}catch(e){fb();}
}
function cbtn(t,label){return '<button class="btn ghost small" data-act="copy" data-copy="'+esc(t)+'">'+(label||'Copier')+'</button>';}

/* ---------- générateurs (modèles à compléter, sans IA) ---------- */
var HOOKS={
  all:['Personne ne te dit la vérité sur {s}.','Voici ce que j\'aurais voulu savoir sur {s} avant de commencer.','Pourquoi la plupart des gens échouent avec {s} ?','Arrête de faire cette erreur avec {s}.','3 choses à savoir sur {s} en moins de 30 secondes.','J\'ai testé {s} pendant 30 jours. Voici ce qui s\'est passé.','Ce détail sur {s} change tout, et presque personne ne le connaît.','Tu fais peut-être {s} à l\'envers. Regarde.','La méthode la plus simple pour réussir avec {s}.'],
  educatif:['Voici comment fonctionne {s}, expliqué en 20 secondes.','Si tu débutes avec {s}, commence par ces 3 règles.','L\'erreur numéro 1 des débutants avec {s}.'],
  direct:['Si tu veux réussir avec {s}, écoute bien.','Arrête de perdre ton temps avec {s}. Fais ça à la place.','Je vais être direct : {s} ne marche pas comme tu le crois.'],
  humour:['{S}, ou comment se compliquer la vie en cinq étapes.','Moi qui découvre {s} : le film.','Les 3 types de personnes qui se lancent dans {s}. Tu es lequel ?'],
  inspirant:['Tu peux réussir avec {s}, même en partant de zéro.','Il y a un an, {s} me paraissait impossible.','Ton prochain petit pas avec {s} commence maintenant.']
};
var PROBLEM={
  educatif:'Beaucoup de gens se lancent dans {s} sans méthode, et abandonnent au bout de deux semaines. Le problème est rarement le talent, c\'est l\'ordre dans lequel on apprend.',
  direct:'Soyons clairs : sans méthode, {s} ne donne rien. Tu perds du temps, tu te décourages, et tu recommences à zéro.',
  humour:'Tu as déjà essayé {s} en improvisant ? Moi oui, et ça s\'est très mal passé. Voici comment éviter mes erreurs.',
  inspirant:'Au début, {s} paraît trop compliqué. Pourtant chaque grand résultat commence par un petit pas, et le tien est plus proche que tu ne le crois.'
};
var POINTS=[
  'La base de {s}. Dis-la en une phrase simple, puis montre un exemple concret : [ton exemple].',
  'L\'erreur courante avec {s} : [l\'erreur que tu vois le plus]. Ce qu\'il faut faire à la place : [ta solution].',
  'Un détail qui change tout avec {s} : [ton astuce précise]. Montre l\'avant et l\'après à l\'écran.',
  'Un outil ou une méthode gratuite pour {s} : [nom]. Montre comment l\'utiliser en 10 secondes.',
  'Un résultat réel obtenu avec {s} : [chiffre ou preuve vécue]. Ne mets que ce qui est vrai.',
  'Ce que personne ne montre sur {s} : [la vraie difficulté] et comment la contourner.'
];
var CTA={
  tiktok:['Abonne-toi pour la suite, et dis-moi en commentaire quel point tu veux que je détaille.','Commente « suite » et je fais la partie 2.'],
  instagram:['Enregistre cette vidéo pour la retrouver, et envoie-la à quelqu\'un qui en a besoin.','Dis-moi en commentaire : tu en es où avec {s} ?'],
  youtube:['Si ça t\'a aidé, abonne-toi et dis-moi en commentaire la prochaine vidéo que tu veux voir.','Regarde la vidéo suivante pour passer à l\'étape d\'après, le lien est à l\'écran.']
};
var TONE_NOTE={educatif:'Parle calmement, une idée par phrase, montre à l\'écran ce que tu dis.',direct:'Phrases courtes, pas d\'introduction, va droit au but dès la première seconde.',humour:'Joue l\'exagération, garde un visage sérieux, laisse un blanc avant la chute.',inspirant:'Voix posée, une histoire personnelle courte, termine par une action simple.'};
var SHOOT={
  tiktok:['Format vertical 9:16, cadre serré sur ton visage.','Texte de l\'accroche écrit à l\'écran dès la première image.','Sous-titres lisibles, coupe les silences.'],
  instagram:['Format vertical 9:16, garde le haut et le bas libres pour l\'interface.','Lumière de face (près d\'une fenêtre).','Couverture claire avec un titre de 4 mots maximum.'],
  youtube:['Format horizontal 16:9 (ou 9:16 pour un Short).','Micro proche ou téléphone à 30 cm de ta bouche, pour un son net.','Chapitres dans la description pour garder les spectateurs.']
};
function fill(t,s){return t.replace(/\{S\}/g,cap(s)).replace(/\{s\}/g,s);}
function secsFor(plat,dur){return plat==='youtube'?dur*60:dur;}

function buildScript(f){
  var s=f.subject.trim(), plat=f.platform, tone=f.tone, dur=+f.dur, secs=[];
  var hook=fill(pick(HOOKS[tone].concat(HOOKS.all)),s);
  var pts=shuffle(POINTS);
  var cta=fill(pick(CTA[plat]),s);
  var total=secsFor(plat,dur), t=0;
  function add(label,len,text){var a=t;t=Math.min(total,t+len);secs.push({label:label,start:a,end:t,text:text});}
  if(plat==='youtube'){
    var n=dur>=10?4:3;
    add('Accroche',Math.max(20,total*0.05),hook+'\nPromets le résultat de la vidéo en une phrase.');
    add('Promesse et plan',total*0.07,'Aujourd\'hui, tu vas comprendre '+s+'. Annonce les '+n+' parties de la vidéo.\n'+fill(PROBLEM[tone],s));
    var body=total*0.7/n;
    for(var i=0;i<n;i++){add('Partie '+(i+1),body,fill(pts[i],s));}
    add('Récapitulatif',total*0.08,'Résume les '+n+' parties en une phrase chacune.');
    add('Appel à l\'action',total*0.1,cta);
  }else{
    var np=total<=15?1:(total<=30?2:3);
    add('Accroche',3,hook);
    if(total>15){add('Problème',total<=30?5:7,fill(PROBLEM[tone],s));}
    var left=total-t-(total>=60?7:5)-(total>=60?7:0);
    var each=Math.max(4,left/np);
    for(var j=0;j<np;j++){add('Point '+(j+1),each,fill(pts[j],s));}
    if(total>=60){add('Preuve',7,fill(POINTS[4],s));}
    t=Math.min(t,total-5);
    add('Appel à l\'action',total-t,cta);
  }
  secs.forEach(function(x){x.time=plat==='youtube'?mmss(x.start):(Math.round(x.start)+'–'+Math.round(x.end)+' s');});
  return {id:uid(),platform:plat,subject:s,tone:tone,dur:dur,hook:hook,sections:secs,notes:[TONE_NOTE[tone]].concat(SHOOT[plat]),created:iso(new Date())};
}
function scriptText(sc){
  var o=PLAT[sc.platform]+' — '+sc.subject+'\n\n';
  sc.sections.forEach(function(x){o+='['+x.time+'] '+x.label+'\n'+x.text+'\n\n';});
  return o.trim();
}

function hashtags(f){
  var stop=['pour','avec','dans','comment','sans','plus','tout','tous','cette','votre','notre','mais','sont','faire','etre','vous','nous','leur','leurs','entre','chez','donc','voici','voila','quand','alors','aussi','ainsi','apres','avant','depuis','pendant','encore','toujours','rien','comme','autre','autres','chaque','ceux','celui','celle'];
  var words=[];
  (norm(f.subject)+' '+norm(f.niche)).split(' ').forEach(function(w){if(w.length>3&&stop.indexOf(w)<0&&words.indexOf(w)<0)words.push(w);});
  var tags=words.slice(0,5);
  var sw=norm(f.subject).split(' ').filter(function(w){return w.length>3&&stop.indexOf(w)<0;});
  if(sw.length>1)tags.unshift(sw[0]+sw[1]);
  var nn=norm(f.niche).split(' ').filter(Boolean).join('');
  if(nn&&tags.indexOf(nn)<0)tags.push(nn);
  var loc={bf:['burkinafaso','afrique','afriquefrancophone'],afr:['afrique','afriquefrancophone'],mondial:['francophone','francophonie']}[f.loc]||[];
  var plat={tiktok:['pourtoi','fyp','apprendresurtiktok','astuces'],instagram:['reels','reelsinstagram','conseils','astuces'],youtube:['youtube','tutoriel','conseils']}[f.platform];
  var lim={tiktok:8,instagram:5,youtube:5}[f.platform];
  var all=[];
  tags.concat(loc,plat).forEach(function(t){if(t&&all.indexOf(t)<0)all.push(t);});
  return all.slice(0,lim).map(function(t){return '#'+t;}).join(' ');
}
function buildPack(f){
  var s=f.subject.trim(), y=new Date().getFullYear();
  var pool=HOOKS.all.concat(HOOKS[f.tone]);
  var hooks=shuffle(pool).slice(0,6).map(function(h){return fill(h,s);});
  var T=['{S} : le guide complet pour débutants','Comment réussir avec {s} (méthode simple)','Les erreurs à éviter avec {s}','{S} en '+y+' : ce qui marche vraiment','{S} : 5 conseils que j\'aurais aimé connaître','Débuter avec {s} en partant de zéro','{S} expliqué simplement'];
  var titles=shuffle(T).slice(0,5).map(function(h){return fill(h,s);});
  var tags=hashtags(f), plat=f.platform, h0=hooks[0], desc;
  if(plat==='tiktok'){desc=h0+'\n'+cap(s)+' expliqué simplement. Dis-moi en commentaire ce que tu veux voir ensuite.\n\n'+tags;}
  else if(plat==='instagram'){desc=h0+'\n\nDans ce Reel : l\'essentiel sur '+s+', sans jargon.\nEnregistre-le pour le retrouver, et partage-le à quelqu\'un qui en a besoin.\n\n'+tags;}
  else{desc=titles[0]+'\n\nDans cette vidéo, je t\'explique '+s+' pas à pas.\n\nChapitres :\n0:00 Introduction\n[ajoute tes chapitres ici]\n\nAbonne-toi pour ne pas rater la suite.\n\n'+tags;}
  return {hooks:hooks,titles:titles,desc:desc,tags:tags,platform:plat};
}

function checkHook(text){
  var t=String(text||'').trim(), n=norm(t), nw=n.split(' ').filter(Boolean), wc=t.split(/\s+/).filter(Boolean).length, score=0, r=[];
  function has(list){return list.some(function(w){return nw.indexOf(w)>=0;});}
  function add(got,ok,okTxt,tip){score+=got;r.push({ok:ok,txt:ok?okTxt:tip});}
  add(wc<=12?25:(wc<=18?12:0),wc<=12,"Courte ("+wc+" mots) : elle se dit en 3 secondes.","Trop longue ("+wc+" mots). Vise 12 mots maximum pour tenir en 3 secondes.");
  var you=has(['tu','te','ton','ta','tes','toi','vous','votre','vos']);
  add(you?15:0,you,"Elle parle directement au spectateur.","Parle au spectateur avec « tu » ou « vous ».");
  var num=/\d/.test(t)||has(['deux','trois','quatre','cinq','six','sept','huit','neuf','dix']);
  add(num?15:0,num,"Elle contient un chiffre, ce qui rend la promesse concrète.","Ajoute un chiffre (ex. « 3 erreurs », « en 30 secondes »).");
  var cur=t.indexOf('?')>=0||has(['secret','secrets','erreur','erreurs','verite','personne','jamais','arrete','stop','attention','faux','piege']);
  add(cur?20:0,cur,"Elle crée de la curiosité.","Crée de la curiosité : pose une question ou annonce une erreur ou un secret.");
  var ben=has(['gratuit','simple','facile','rapide','sans','seconde','secondes','minute','minutes','jour','jours','vite']);
  add(ben?15:0,ben,"Elle annonce un bénéfice ou un délai.","Annonce un bénéfice clair (gagner du temps, des vues, de l'argent) ou un délai.");
  var weak=/^(bonjour|salut|hello|coucou|bienvenue|aujourd hui|dans cette video|je vais vous)/.test(nw.slice(0,3).join(' '));
  add(weak?0:10,!weak,"Elle commence directement.","Ne commence pas par « Bonjour » ou « Aujourd'hui ». Va droit au sujet.");
  return {score:score,rules:r,wc:wc};
}
function firstSentence(t){var m=String(t).match(/^[^.!?…]*[.!?…]?/);return m?m[0].trim():String(t).trim();}

/* ---------- sous-titres ---------- */
function makeSubs(text,wps,maxc){
  var words=text.replace(/\s+/g,' ').trim().split(' ').filter(Boolean), blocks=[], cur=[];
  function len(a){return a.join(' ').length;}
  words.forEach(function(w){
    cur.push(w);
    var end=/[.!?…]$/.test(w);
    if(len(cur)>=maxc*2-6||(end&&cur.length>=3)){blocks.push(cur);cur=[];}
  });
  if(cur.length)blocks.push(cur);
  var t=0;
  return blocks.map(function(b,i){
    var d=Math.max(1,b.length/wps), txt=b.join(' ');
    if(txt.length>maxc){var mid=Math.floor(txt.length/2),best=-1,bd=999;for(var k=0;k<txt.length;k++){if(txt.charAt(k)===' '&&Math.abs(k-mid)<bd){bd=Math.abs(k-mid);best=k;}}if(best>0)txt=txt.slice(0,best)+'\n'+txt.slice(best+1);}
    var o={n:i+1,start:t,end:t+d,text:txt};t+=d;return o;
  });
}
function srt(subs){return subs.map(function(b){return b.n+'\n'+srtTime(b.start)+' --> '+srtTime(b.end)+'\n'+b.text;}).join('\n\n');}

function analyse(){
  var e=S.stats.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  if(!e.length)return null;
  function tot(k,a){return (a||e).reduce(function(s,x){return s+(+x[k]||0);},0);}
  var views=tot('views'), inter=tot('likes')+tot('comments')+tot('shares');
  var o={e:e,n:e.length,views:views,eng:views?inter/views*100:0,follow:tot('follow'),recs:[]};
  var R=o.recs;
  function avg(a,k){return a.length?tot(k,a)/a.length:0;}
  if(o.n<5)R.push({t:'info',x:'Tu as saisi '+o.n+' publication'+(o.n>1?'s':'')+'. Les conseils deviennent plus fiables à partir de 5.'});
  if(views>0){
    if(o.eng<3)R.push({t:'warn',x:'Ton engagement moyen est de '+pct(o.eng)+'. Renforce les 3 premières secondes et termine par une question précise pour faire réagir.'});
    else if(o.eng<6)R.push({t:'info',x:'Ton engagement moyen est de '+pct(o.eng)+', ce qui est correct. Pour dépasser 6 %, demande une action claire en fin de vidéo (commenter, enregistrer).'});
    else R.push({t:'good',x:'Ton engagement moyen est de '+pct(o.eng)+', très bon niveau. Garde ton format actuel et change seulement le sujet.'});
    var cr=tot('comments')/views*100, sr=tot('shares')/views*100;
    if(cr<0.3)R.push({t:'warn',x:'Peu de commentaires ('+pct(cr)+' des vues). Pose une question à deux choix (A ou B) à la fin.'});
    if(sr<0.5)R.push({t:'warn',x:'Peu de partages ('+pct(sr)+' des vues). Crée du contenu à envoyer à un ami : listes, astuces utiles, erreurs à éviter.'});
    if(views>=1000&&o.follow/views*100<0.5)R.push({t:'warn',x:'Peu d\'abonnés gagnés par rapport aux vues. Annonce une suite (« partie 2 demain ») pour donner une raison de s\'abonner.'});
  }
  var by={};
  e.forEach(function(x){(by[x.plat]=by[x.plat]||[]).push(x);});
  var keys=Object.keys(by);
  o.byPlat=keys.map(function(k){return {k:k,n:by[k].length,avg:avg(by[k],'views')};}).sort(function(a,b){return b.avg-a.avg;});
  if(keys.length>1)R.push({t:'good',x:'Ta meilleure plateforme est '+PLAT[o.byPlat[0].k]+' avec '+nf(o.byPlat[0].avg)+' vues en moyenne. Publie-y en priorité.'});
  var dd={};
  e.forEach(function(x){var i=dowIdx(parse(x.date));(dd[i]=dd[i]||[]).push(x);});
  var dk=Object.keys(dd);
  if(o.n>=4&&dk.length>=2){var bd=dk.map(function(k){return {k:+k,a:avg(dd[k],'views')};}).sort(function(a,b){return b.a-a.a;})[0];R.push({t:'info',x:'Tes publications du '+DAYS_FULL[bd.k]+' ont le plus de vues en moyenne ('+nf(bd.a)+'). Programme tes meilleurs contenus ce jour-là.'});}
  var hs=e.filter(function(x){return x.hour!==undefined&&x.hour!==null&&x.hour!==''&&!isNaN(+x.hour);});
  if(hs.length>=4){
    var slot=function(hh){hh=+hh;return hh<12?'le matin (avant 12 h)':(hh<17?"l'après-midi (12 h à 17 h)":(hh<22?'le soir (17 h à 22 h)':'la nuit (après 22 h)'));};
    var sg={};hs.forEach(function(x){var k=slot(x.hour);(sg[k]=sg[k]||[]).push(x);});
    var sk=Object.keys(sg);
    if(sk.length>=2){var bs=sk.map(function(k){return {k:k,a:avg(sg[k],'views')};}).sort(function(a,b){return b.a-a.a;})[0];R.push({t:'info',x:'Tes publications '+bs.k+' ont le plus de vues en moyenne ('+nf(bs.a)+'). Programme tes meilleurs contenus à ce moment.'});}
  }
  if(o.n>=6){
    var l3=e.slice(-3), p3=e.slice(-6,-3), la=avg(l3,'views'), pa=avg(p3,'views');
    if(pa>0){var ch=(la-pa)/pa*100;
      if(ch>15)R.push({t:'good',x:'Tes 3 dernières publications font '+nf(ch)+' % de vues en plus que les 3 précédentes. Continue sur cette lancée.'});
      else if(ch<-15)R.push({t:'warn',x:'Tes 3 dernières publications font '+nf(-ch)+' % de vues en moins que les 3 précédentes. Reviens au format de ta meilleure publication et teste 3 nouvelles accroches.'});}
  }
  var sh=e.filter(function(x){return +x.dur>0&&+x.dur<=30;}), lo=e.filter(function(x){return +x.dur>30;});
  if(sh.length>=2&&lo.length>=2){var as=avg(sh,'views'), al=avg(lo,'views');R.push({t:'info',x:as>al?'Tes vidéos de 30 secondes ou moins ont plus de vues ('+nf(as)+' contre '+nf(al)+'). Garde-les courtes.':'Tes vidéos de plus de 30 secondes ont plus de vues ('+nf(al)+' contre '+nf(as)+'). Tu peux développer davantage.'});}
  var best=e.slice().sort(function(a,b){return b.views-a.views;})[0];
  o.best=best;
  R.push({t:'info',x:'Ta meilleure publication : '+PLAT[best.plat]+' du '+shortDate(best.date)+' avec '+nf(best.views)+' vues. Refais ce format avec un autre sujet.'});
  return o;
}
function chartSvg(e){
  var d=e.slice(-10), W=320,H=150,x0=34,x1=312,y0=10,y1=120;
  var mx=Math.max.apply(null,d.map(function(x){return +x.views||0;}))||1;
  var mag=Math.pow(10,Math.floor(Math.log(mx)/Math.LN10)), step=mag/2; var top=Math.ceil(mx/step)*step; if(top<=0)top=1;
  function yv(v){return y1-(v/top)*(y1-y0);}
  var g='<line class="grid" x1="'+x0+'" x2="'+x1+'" y1="'+y1+'" y2="'+y1+'"/><line class="grid" x1="'+x0+'" x2="'+x1+'" y1="'+yv(top/2)+'" y2="'+yv(top/2)+'"/><line class="grid" x1="'+x0+'" x2="'+x1+'" y1="'+yv(top)+'" y2="'+yv(top)+'"/>';
  g+='<text x="'+(x0-4)+'" y="'+(y1+3)+'" text-anchor="end">0</text><text x="'+(x0-4)+'" y="'+(yv(top/2)+3)+'" text-anchor="end">'+nf(top/2)+'</text><text x="'+(x0-4)+'" y="'+(yv(top)+3)+'" text-anchor="end">'+nf(top)+'</text>';
  var slot=(x1-x0)/d.length, bw=Math.min(24,slot-6);
  d.forEach(function(x,i){var cx=x0+slot*i+slot/2,h=y1-yv(+x.views||0);g+='<rect class="b" x="'+(cx-bw/2)+'" y="'+yv(+x.views||0)+'" width="'+bw+'" height="'+h+'" rx="3"/><text x="'+cx+'" y="'+(y1+14)+'" text-anchor="middle">'+shortDate(x.date)+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Vues des dernières publications" width="100%">'+g+'</svg>';
}

function streak(){
  var set={};S.posts.forEach(function(p){if(p.status==='done')set[p.date]=1;});S.stats.forEach(function(x){set[x.date]=1;});
  var d=new Date(), n=0, today=!!set[iso(d)];
  if(!today)d=addDays(d,-1);
  while(set[iso(d)]){n++;d=addDays(d,-1);}
  return {n:n,today:today};
}

function aiReady(){return !!(lsGet(AIPROXY)||lsGet(AIKEY));}
function callAI(prompt,system){
  var proxy=lsGet(AIPROXY), key=lsGet(AIKEY), model=lsGet(AIMODEL)||'gemini-flash-latest';
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},45000), req;
  if(proxy){
    req=fetch(proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,system:system||''}),signal:ctl?ctl.signal:undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.error?(typeof j.error==='string'?j.error:(j.error.message||'Erreur '+r.status)):('Erreur '+r.status));return (j&&j.text)||'';});});
  }else if(key){
    var body={contents:[{role:'user',parts:[{text:prompt}]}]};
    if(system)body.systemInstruction={parts:[{text:system}]};
    req=fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined}).then(function(r){return r.json().then(function(j){
      if(!r.ok)throw new Error(j&&j.error&&j.error.message?j.error.message:('Erreur '+r.status));
      var c=j.candidates&&j.candidates[0], parts=(c&&c.content&&c.content.parts)||[], t=parts.map(function(x){return x.text||'';}).join('');
      if(!t)throw new Error(c&&c.finishReason?('Réponse vide ('+c.finishReason+')'):'Réponse vide');
      return t;});});
  }else{clearTimeout(to);return Promise.reject(new Error('NOKEY'));}
  return req.then(function(t){clearTimeout(to);return t;},function(e){clearTimeout(to);throw e;});
}
function friendlyErr(e){
  var m=String((e&&e.message)||e||'');
  if(m==='NOKEY')return "Connecte d'abord l'IA dans l'onglet Connexion.";
  if(e&&e.name==='AbortError')return "L'IA met trop de temps. Réessaie.";
  if(/quota|RESOURCE_EXHAUSTED|rate limit|429/i.test(m))return "Limite gratuite atteinte. Réessaie dans quelques minutes ou demain.";
  if(/API key|API_KEY|PERMISSION_DENIED|401|403/i.test(m))return "La clé est refusée. Vérifie qu'elle est copiée en entier.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Connexion impossible. Vérifie internet. Cette fonction marche sur ton site publié, pas dans l'aperçu de Claude.";
  return 'Erreur : '+m;
}

function edFmt(x){return (Math.round(x*10)/10).toFixed(1);}
function edCue(rel){var a=UI.subs||[];for(var i=0;i<a.length;i++){if(rel>=a[i].start&&rel<a[i].end)return a[i].text;}return '';}
function edWrap(c,t,maxW){var words=String(t).split(/\s+/),lines=[],cur='';words.forEach(function(w){if(!w)return;var tr=cur?cur+' '+w:w;if(c.measureText(tr).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tr;});if(cur)lines.push(cur);return lines;}
function edText(c,W,H,text,pos,size){
  c.font='800 '+size+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  var lines=edWrap(c,text,W*0.86),lh=size*1.25,total=lines.length*lh;
  var y0=pos==='top'?H*0.08+lh/2:(pos==='middle'?H/2-total/2+lh/2:H*0.88-total+lh/2);
  lines.forEach(function(l,i){var y=y0+i*lh;c.lineWidth=size*0.22;c.strokeStyle='#000';c.strokeText(l,W/2,y);c.fillStyle='#fff';c.fillText(l,W/2,y);});
}

function edExport(){
  var v=ED.v;
  if(ED.busy)return;
  if(!v){toast('Choisis d\'abord une vidéo.');return;}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){ED.err='Ce navigateur ne sait pas exporter de vidéo. Essaie avec Chrome à jour.';edMount();return;}
  var dur=ED.end-ED.start;if(dur<0.5){toast('La partie gardée est trop courte.');return;}
  var vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh){toast('Vidéo pas encore chargée.');return;}
  var W,H;
  if(F('ed_fmt','orig')==='916'){W=720;H=1280;}
  else{var sc=Math.min(1,1280/Math.max(vw,vh));W=Math.max(2,Math.round(vw*sc/2)*2);H=Math.max(2,Math.round(vh*sc/2)*2);}

  try{
    var AC=window.AudioContext||window.webkitAudioContext;

  }catch(e){noAudio=true;}
  var types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'],mt='';
  types.some(function(t){try{if(MediaRecorder.isTypeSupported(t)){mt=t;return true;}}catch(e){}return false;});
  var rec;
  try{rec=mt?new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:4000000}):new MediaRecorder(stream);}catch(e){ED.err='Impossible de démarrer l\'enregistrement sur cet appareil.';edMount();return;}
  var chunks=[],title=F('ed_title').trim(),useSubs=F('ed_subs','on')==='on',pos=F('ed_pos','bottom'),size=Math.round(W*0.055);
  ED.busy=true;ED.cancel=false;ED.prog=0;ED.err='';
  if(ED.outUrl){try{URL.revokeObjectURL(ED.outUrl);}catch(e){}ED.outUrl='';ED.outBlob=null;}
  edMount();

  rec.onstop=function(){

    var type=(rec.mimeType||mt||'video/webm').split(';')[0];
    var blob=new Blob(chunks,{type:type});

    ED.outBlob=blob;ED.outExt=/mp4/.test(type)?'mp4':'webm';ED.outUrl=URL.createObjectURL(blob);

  function frame(){
    if(!ED.busy)return;

    if(title&&rel>=0&&rel<3)edText(c,W,H,title,'top',size);
    if(useSubs){var tx=edCue(rel);if(tx)edText(c,W,H,tx,pos,size);}
    ED.prog=Math.max(0,Math.min(1,rel/dur));

    if(ED.cancel||t>=ED.end-0.02||v.ended){try{v.pause();}catch(e){}try{rec.stop();}catch(e){}return;}

  }

    var text=F('ai_text').trim();
    if(!text){toast("Écris d'abord ton sujet ou ta question.");return;}
    runAI('assist',aiPrompt(F('ai_kind','script'),text),sysPrompt(F('ai_lang','Français')));
  },
  'trad-run':function(){
    var text=F('tr_text').trim();
    if(!text){toast("Colle d'abord ton texte.");return;}
    runAI('trad','Traduis le texte suivant en '+F('tr_lang','Anglais')+".\nGarde les hashtags, les emojis, les noms propres et les sauts de ligne. Réponds uniquement avec la traduction.\n\n"+text,"Tu es un traducteur professionnel. Réponds uniquement avec la traduction, sans commentaire.");
  },
  'ai-save':function(){
    var k=(($('#ai_key')||{}).value||'').trim(), m=(($('#ai_model')||{}).value||'').trim(), px=(($('#ai_proxy')||{}).value||'').trim();
    if(px&&!/^https:\/\//i.test(px)){toast("L'adresse doit commencer par https://");return;}
    if(k)lsSet(AIKEY,k);
    lsSet(AIMODEL,m);lsSet(AIPROXY,px);
    toast('Enregistré');render(true);
  },
  'ai-test':function(){
    if(!aiReady()){toast("Enregistre d'abord ta clé.");return;}
    toast('Test en cours…');
    callAI('Réponds uniquement par le mot OK.','').then(function(){toast('Connexion réussie');},function(e){toast(friendlyErr(e));});
  },
  'ai-clear':function(){lsSet(AIKEY,'');toast('Clé effacée');render(true);},
  'save-script':function(){if(!UI.script)return;S.library.unshift(UI.script);save();toast('Script enregistré');render(true);},
  'del-script':function(el){S.library=S.library.filter(function(x){return x.id!==el.dataset.id;});save();render(true);},
  plan:function(el){
    var sc=el.dataset.src==='result'?UI.script:S.library.filter(function(x){return x.id===el.dataset.src;})[0];
    if(!sc)return;var d=F('plandate',iso(addDays(new Date(),1)));
    addPost({date:d,plat:sc.platform,title:cap(sc.subject),note:'Accroche : '+sc.hook});save();UI.cal={y:parse(d).getFullYear(),m:parse(d).getMonth()};UI.sel=d;toast('Ajouté à l\'agenda le '+shortDate(d));
  },
  'gen-subs':function(){var t=F('sub_text');if(!t.trim()){toast('Colle d\'abord ton texte.');return;}UI.subs=makeSubs(t,+F('sub_wps','2.7'),+F('sub_max','32'));render(true);},
  speak:function(){
    var t=F('sub_text');if(!t.trim()){toast('Colle d\'abord ton texte.');return;}
    if(!window.speechSynthesis){toast('La lecture vocale n\'est pas disponible ici.');return;}
    try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';var v=voices().filter(function(x){return x.name===F('voice');})[0]||voices()[0];if(v){u.voice=v;u.lang=v.lang;}u.rate=+F('rate','1');speechSynthesis.speak(u);}catch(e){toast('Lecture impossible sur cet appareil.');}
  },
  stopspeak:function(){try{speechSynthesis.cancel();}catch(e){}},
  'cal-prev':function(){UI.cal.m--;if(UI.cal.m<0){UI.cal.m=11;UI.cal.y--;}render(true);},
  'cal-next':function(){UI.cal.m++;if(UI.cal.m>11){UI.cal.m=0;UI.cal.y++;}render(true);},
  selday:function(el){UI.sel=el.dataset.v;render(true);},
  'add-post':function(){
    if(!need('p_title','Donne un titre à ta publication.'))return;
    addPost({date:UI.sel,plat:F('p_plat','tiktok'),title:F('p_title').trim(),time:F('p_time','18:00'),note:F('p_note')});
    S.form.p_title='';S.form.p_note='';save();toast('Publication ajoutée');render(true);
  },
  'toggle-post':function(el){S.posts.forEach(function(p){if(p.id===el.dataset.id)p.status=p.status==='done'?'planned':'done';});save();render(true);},
  'del-post':function(el){S.posts=S.posts.filter(function(p){return p.id!==el.dataset.id;});save();render(true);},
  'add-stat':function(){
    var v=+F('s_views');if(!(v>0)){toast('Saisis au moins le nombre de vues.');var e=$('#s_views');if(e)e.focus();return;}
    S.stats.push({id:uid(),date:F('s_date',iso(new Date())),plat:F('s_plat','tiktok'),views:v,likes:+F('s_likes')||0,comments:+F('s_comments')||0,shares:+F('s_shares')||0,follow:+F('s_follow')||0,dur:+F('s_dur')||0,hour:F('s_time')?+F('s_time').split(':')[0]:'',title:''});
    ['s_views','s_likes','s_comments','s_shares','s_follow','s_dur','s_time'].forEach(function(k){S.form[k]='';});save();toast('Statistiques enregistrées');render(true);
  },
  'del-stat':function(el){S.stats=S.stats.filter(function(x){return x.id!==el.dataset.id;});save();render(true);},
  'coach-gen':function(){
    if(!need('cniche','Indique ton domaine.'))return;
    S.coach=buildCoach({cniche:F('cniche'),goal:F('goal','abonnes'),cplat:F('cplat','tiktok'),freq:F('freq','3'),time:F('time','60'),level:F('level','debutant')});save();render(true);
  },
  'coach-add':function(){
    var c=S.coach;if(!c)return;var t=new Date(),n=0;
    c.week.forEach(function(w){var off=(w.day-dowIdx(t)+7)%7;addPost({date:iso(addDays(t,off)),plat:c.platform,title:w.idea,note:'Pilier : '+w.pillar});n++;});
    save();toast(n+' publications ajoutées à l\'agenda');
  },
  'clear-demo':function(){S.posts=S.posts.filter(function(x){return !x.demo;});S.stats=S.stats.filter(function(x){return !x.demo;});S.library=S.library.filter(function(x){return !x.demo;});save();render(true);toast('Exemples effacés');},
  settings:function(){UI.wipe=false;openSheet();},
  'close-sheet':function(){$('#sheet').hidden=true;},
  'copy-backup':function(){copy(JSON.stringify(S));},
  restore:function(){
    var t=($('#restore')||{}).value||'';
    try{var o=JSON.parse(t);if(!o||typeof o!=='object'||!Array.isArray(o.posts)||!Array.isArray(o.stats))throw new Error('x');S=Object.assign(defaults(),o);save();applyTheme();$('#sheet').hidden=true;render();toast('Sauvegarde restaurée');}
    catch(e){toast('Sauvegarde invalide. Colle le texte complet.');}
  },
  'ed-setstart':function(){if(!ED.v)return;ED.start=Math.max(0,Math.min(ED.v.currentTime,ED.end-0.3));edSync();},
  'ed-setend':function(){if(!ED.v)return;ED.end=Math.min(ED.dur,Math.max(ED.v.currentTime,ED.start+0.3));edSync();},
  'ed-export':function(){edExport();},
  'ed-cancel':function(){ED.cancel=true;},
  'ed-share':function(){edShare();},
  wipe:function(){
    if(!UI.wipe){UI.wipe=true;openSheet();return;}
    S=defaults();save();lsSet(AIKEY,'');lsSet(AIMODEL,'');lsSet(AIPROXY,'');UI.script=null;UI.pack=null;UI.subs=null;UI.wipe=false;applyTheme();$('#sheet').hidden=true;render();toast('Données effacées');
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.id==='sheet'&&e.target!==el)return;
  var f=ACT[el.dataset.act];if(f)f(el);
});
document.addEventListener('input',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.f&&t.type!=='checkbox'){S.form[t.dataset.f]=t.value;save();}});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.dataset&&t.dataset.ed){edChange(t);return;}
  if(t.dataset&&t.dataset.f){
    if(t.type==='checkbox'){S.form[t.dataset.f]=t.checked?'1':'';save();render(true);return;}
    S.form[t.dataset.f]=t.value;
    if(t.dataset.f==='platform'){S.form.dur=t.value==='youtube'?'8':'30';save();render(true);return;}
    save();}
  if(t.dataset&&t.dataset.actChange==='theme'){S.theme=t.value;save();applyTheme();}
});
$('#sheet').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){if(UI.tab==='create'&&UI.sub==='subs'&&!document.activeElement.closest('#main'))render(true);};}catch(e){}
applyTheme();
render();
if(!S.profile)openWelcome();
})();
</script>
</body>
</html>
